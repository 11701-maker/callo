<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinky Calorie Planner 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fdf2f8; /* rose-50 */
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 pb-10 min-h-screen">

    <!-- Header -->
    <header class="bg-white px-6 py-5 shadow-sm shadow-rose-100 sticky top-0 z-10 flex justify-center items-center">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 to-pink-500 flex items-center gap-2">
            🌸 Pinky Calorie Planner
        </h1>
    </header>

    <main class="max-w-md mx-auto mt-6 px-4" id="app-container">
        <!-- เนื้อหาจะถูกแทรกที่นี่ด้วย JavaScript -->
    </main>

    <script>
        // ฐานข้อมูลอาหารสำหรับแนะนำ
        const foodDB = [
            { id: 1, name: 'ส้มตำไทย', cal: 120, emoji: '🥗' },
            { id: 2, name: 'ยำวุ้นเส้นหมูสับ', cal: 150, emoji: '🥗' },
            { id: 3, name: 'สลัดผักไข่ต้ม', cal: 180, emoji: '🥬' },
            { id: 4, name: 'เกาเหลาหมูตุ๋น', cal: 250, emoji: '🍲' },
            { id: 5, name: 'แซนวิชทูน่า', cal: 250, emoji: '🥪' },
            { id: 6, name: 'ข้าวต้มปลา', cal: 300, emoji: '🥣' },
            { id: 7, name: 'ก๋วยเตี๋ยวน้ำใส', cal: 350, emoji: '🍜' },
            { id: 8, name: 'ข้าวไข่เจียว', cal: 450, emoji: '🍳' },
            { id: 9, name: 'ข้าวผัดหมู', cal: 500, emoji: '🍛' },
            { id: 10, name: 'ผัดไทยกุ้งสด', cal: 550, emoji: '🍝' },
            { id: 11, name: 'ข้าวมันไก่', cal: 600, emoji: '🍗' },
            { id: 12, name: 'ข้าวกะเพราไก่ไข่ดาว', cal: 650, emoji: '🍛' },
            { id: 13, name: 'แอปเปิ้ล 1 ลูก', cal: 80, emoji: '🍎' },
            { id: 14, name: 'กล้วยหอม', cal: 120, emoji: '🍌' },
            { id: 15, name: 'โยเกิร์ตไขมันต่ำ', cal: 80, emoji: '🥛' },
            { id: 16, name: 'กาแฟดำ (ไม่หวาน)', cal: 15, emoji: '☕' },
            { id: 17, name: 'ชาไข่มุก (หวานน้อย)', cal: 250, emoji: '🧋' },
        ];

        const MEAL_CONFIG = {
            breakfast: { name: 'มื้อเช้า', ratio: 0.30, emoji: '🌅' },
            lunch: { name: 'มื้อกลางวัน', ratio: 0.35, emoji: '☀️' },
            dinner: { name: 'มื้อเย็น', ratio: 0.25, emoji: '🌙' },
            snack: { name: 'ของว่าง', ratio: 0.10, emoji: '🍪' }
        };

        // สถานะของแอพพลิเคชัน
        let state = {
            step: 1, // 1 = Form, 2 = Dashboard
            tdee: 0,
            mealsData: {
                breakfast: { consumed: 0, items: [], isAdding: false },
                lunch: { consumed: 0, items: [], isAdding: false },
                dinner: { consumed: 0, items: [], isAdding: false },
                snack: { consumed: 0, items: [], isAdding: false },
            }
        };

        const appContainer = document.getElementById('app-container');

        function renderStep1() {
            appContainer.innerHTML = `
                <div class="bg-white rounded-3xl p-6 shadow-xl shadow-rose-100/50 border border-rose-50 animate-fade-in-up">
                    <h2 class="text-xl font-bold text-rose-600 mb-6 text-center">มาคำนวณแคลอรี่ที่เหมาะสมกันเถอะ ✨</h2>
                    <form id="profile-form" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">เพศ</label>
                                <select id="gender" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-2.5 outline-none focus:border-rose-400 text-gray-700">
                                    <option value="female">หญิง 👩</option>
                                    <option value="male">ชาย 👨</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">อายุ (ปี)</label>
                                <input type="number" id="age" value="25" required min="10" max="100" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-2.5 outline-none focus:border-rose-400 text-gray-700" />
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">น้ำหนัก (กก.)</label>
                                <input type="number" id="weight" value="55" required min="20" max="250" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-2.5 outline-none focus:border-rose-400 text-gray-700" />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1">ส่วนสูง (ซม.)</label>
                                <input type="number" id="height" value="160" required min="100" max="250" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-2.5 outline-none focus:border-rose-400 text-gray-700" />
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">กิจกรรมประจำวัน</label>
                            <select id="activity" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-2.5 outline-none focus:border-rose-400 text-gray-700">
                                <option value="1.2">นั่งทำงานตลอด (ไม่ได้ออกกำลังกาย)</option>
                                <option value="1.375" selected>ขยับตัวบ้าง (ออกกำลังกาย 1-3 วัน/สัปดาห์)</option>
                                <option value="1.55">แอคทีฟปานกลาง (ออกกำลังกาย 3-5 วัน/สัปดาห์)</option>
                                <option value="1.725">แอคทีฟมาก (ออกกำลังกาย 6-7 วัน/สัปดาห์)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">เป้าหมายของคุณ 🎯</label>
                            <select id="goal" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-2.5 outline-none focus:border-rose-400 text-gray-700">
                                <option value="-500">ลดน้ำหนัก (-500 kcal)</option>
                                <option value="0" selected>รักษาน้ำหนัก (พอดีเป้า)</option>
                                <option value="500">เพิ่มน้ำหนัก (+500 kcal)</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full mt-6 bg-gradient-to-r from-rose-400 to-pink-500 hover:from-rose-500 hover:to-pink-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-300/50 transition-transform transform hover:scale-[1.02] active:scale-95 text-lg">
                            คำนวณแคลอรี่ของฉัน 💖
                        </button>
                    </form>
                </div>
            `;

            document.getElementById('profile-form').addEventListener('submit', calculateCalories);
        }

        function calculateCalories(e) {
            e.preventDefault();
            
            const gender = document.getElementById('gender').value;
            const age = Number(document.getElementById('age').value);
            const weight = Number(document.getElementById('weight').value);
            const height = Number(document.getElementById('height').value);
            const activity = Number(document.getElementById('activity').value);
            const goal = Number(document.getElementById('goal').value);

            // Mifflin-St Jeor Equation
            let bmr = (10 * weight) + (6.25 * height) - (5 * age);
            bmr += (gender === 'male') ? 5 : -161;
            
            state.tdee = Math.round(bmr * activity) + goal;
            state.step = 2;
            renderStep2();
        }

        function resetApp() {
            state.step = 1;
            state.tdee = 0;
            state.mealsData = {
                breakfast: { consumed: 0, items: [], isAdding: false },
                lunch: { consumed: 0, items: [], isAdding: false },
                dinner: { consumed: 0, items: [], isAdding: false },
                snack: { consumed: 0, items: [], isAdding: false },
            };
            renderStep1();
        }

        function renderStep2() {
            // คำนวณรวมแคลอรี่ที่กินไป
            const totalConsumed = Object.values(state.mealsData).reduce((sum, meal) => sum + meal.consumed, 0);
            const progressPercent = Math.min(100, (totalConsumed / state.tdee) * 100);
            const totalRemaining = Math.max(0, state.tdee - totalConsumed);

            let html = `
                <div class="animate-fade-in-up">
                    <!-- Summary Widget -->
                    <div class="bg-gradient-to-br from-rose-400 to-pink-500 rounded-3xl p-6 shadow-xl shadow-rose-300/40 text-white mb-6 relative overflow-hidden">
                        <div class="absolute top-0 right-0 opacity-10 pointer-events-none transform translate-x-4 -translate-y-4">
                            <svg width="150" height="150" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </div>
                        
                        <div class="flex justify-between items-start mb-4 relative z-10">
                            <div>
                                <h2 class="text-rose-100 font-medium text-sm">เป้าหมายแคลอรี่ต่อวัน</h2>
                                <div class="text-4xl font-black">${state.tdee} <span class="text-lg font-medium text-rose-100">kcal</span></div>
                            </div>
                            <button onclick="resetApp()" class="bg-white/20 hover:bg-white/30 p-2 rounded-xl backdrop-blur-sm transition-colors text-white text-sm">
                                คำนวณใหม่
                            </button>
                        </div>

                        <!-- Progress Bar -->
                        <div class="relative z-10 mt-6">
                            <div class="flex justify-between text-xs text-rose-100 mb-2 font-medium">
                                <span>กินไปแล้ว ${totalConsumed} kcal</span>
                                <span>เหลือโควต้า ${totalRemaining} kcal</span>
                            </div>
                            <div class="w-full bg-white/20 h-3 rounded-full overflow-hidden backdrop-blur-sm">
                                <div class="bg-white h-full rounded-full transition-all duration-700 ease-out" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>

                    <div id="meals-container" class="space-y-4">
                    </div>
                </div>
            `;

            appContainer.innerHTML = html;
            renderMeals();
        }

        function renderMeals() {
            const container = document.getElementById('meals-container');
            container.innerHTML = '';

            Object.keys(MEAL_CONFIG).forEach(mealKey => {
                const config = MEAL_CONFIG[mealKey];
                const data = state.mealsData[mealKey];
                const targetCal = Math.round(state.tdee * config.ratio);
                const remaining = targetCal - data.consumed;
                
                // ประเมินสถานะของมื้อนั้นๆ
                let statusText = '';
                let statusColor = '';
                
                if (remaining > 50) {
                    statusText = `ขาดอีก ${remaining} kcal`;
                    statusColor = 'bg-amber-100 text-amber-700 border-amber-200';
                } else if (remaining < -50) {
                    statusText = `เกินมา ${Math.abs(remaining)} kcal ⚠️`;
                    statusColor = 'bg-red-100 text-red-600 border-red-200';
                } else {
                    statusText = `พอดีเป้าหมาย! 🎯`;
                    statusColor = 'bg-emerald-100 text-emerald-600 border-emerald-200';
                }

                // แนะนำอาหารที่แคลอรี่ไม่เกินโควต้าที่เหลือ
                const recommendedFoods = foodDB
                    .filter(food => food.cal <= (remaining + 50) && remaining > 50)
                    .sort((a, b) => b.cal - a.cal)
                    .slice(0, 4);

                let mealHtml = `
                    <div class="bg-white rounded-3xl p-5 shadow-lg shadow-rose-100/50 mb-5 border border-rose-50 transition-all">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-xl font-bold text-rose-700 flex items-center gap-2">
                                <span>${config.emoji}</span> ${config.name}
                            </h3>
                            <div class="text-right">
                                <div class="text-sm text-gray-500">เป้าหมาย: ${targetCal} kcal</div>
                                <div class="text-lg font-bold text-rose-500">${data.consumed} <span class="text-sm font-normal text-gray-400">kcal</span></div>
                            </div>
                        </div>

                        <!-- Status Badge -->
                        <div class="inline-block px-3 py-1 rounded-full text-sm font-medium border mb-4 ${statusColor}">
                            ${statusText}
                        </div>

                        <!-- Food List -->
                        ${data.items.length > 0 ? `
                            <ul class="space-y-2 mb-4">
                                ${data.items.map((item, idx) => `
                                    <li class="flex justify-between items-center bg-rose-50/50 px-3 py-2 rounded-xl text-sm">
                                        <span class="text-gray-700">${item.name}</span>
                                        <div class="flex items-center gap-3">
                                            <span class="font-semibold text-rose-600">${item.cal} kcal</span>
                                            <button onclick="removeFood('${mealKey}', ${idx}, ${item.cal})" class="text-gray-400 hover:text-red-500 transition-colors">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                                            </button>
                                        </div>
                                    </li>
                                `).join('')}
                            </ul>
                        ` : ''}

                        <!-- Add Custom Food UI -->
                        ${data.isAdding ? `
                            <div class="bg-rose-50 p-3 rounded-2xl flex gap-2 animate-fade-in-down mb-4">
                                <input type="text" id="customFood-${mealKey}" placeholder="ชื่ออาหาร" class="flex-1 bg-white rounded-xl px-3 py-2 text-sm outline-none border border-rose-100 focus:border-rose-300" />
                                <input type="number" id="customCal-${mealKey}" placeholder="แคลอรี่" class="w-20 bg-white rounded-xl px-3 py-2 text-sm outline-none border border-rose-100 focus:border-rose-300" />
                                <button onclick="addCustomFood('${mealKey}')" class="bg-rose-400 hover:bg-rose-500 text-white px-3 py-2 rounded-xl text-sm font-medium transition-colors">เพิ่ม</button>
                                <button onclick="toggleAddMode('${mealKey}', false)" class="bg-white text-gray-500 px-3 py-2 rounded-xl text-sm font-medium border border-gray-200 transition-colors">ยกเลิก</button>
                            </div>
                        ` : `
                            <button onclick="toggleAddMode('${mealKey}', true)" class="w-full py-2 mb-4 rounded-xl border-2 border-dashed border-rose-200 text-rose-400 font-medium hover:bg-rose-50 hover:border-rose-300 transition-colors flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                                เพิ่มอาหารเอง
                            </button>
                        `}

                        <!-- Recommendations -->
                        ${recommendedFoods.length > 0 ? `
                            <div class="mt-2">
                                <p class="text-xs font-semibold text-rose-400 mb-2 uppercase tracking-wide">💡 เมนูแนะนำที่กินได้พอดี</p>
                                <div class="flex overflow-x-auto gap-2 pb-2 scrollbar-hide">
                                    ${recommendedFoods.map(food => `
                                        <button onclick="addFood('${mealKey}', '${food.name}', ${food.cal})" class="flex-shrink-0 bg-rose-50 hover:bg-rose-100 border border-rose-100 px-3 py-2 rounded-2xl flex items-center gap-2 transition-colors text-left">
                                            <span class="text-xl">${food.emoji}</span>
                                            <div>
                                                <div class="text-sm font-medium text-gray-700">${food.name}</div>
                                                <div class="text-xs text-rose-500">${food.cal} kcal</div>
                                            </div>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                // Add to container
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = mealHtml;
                container.appendChild(tempDiv.firstElementChild);
            });
        }

        function toggleAddMode(mealKey, isAdding) {
            state.mealsData[mealKey].isAdding = isAdding;
            renderStep2();
        }

        function addCustomFood(mealKey) {
            const nameInput = document.getElementById(`customFood-${mealKey}`);
            const calInput = document.getElementById(`customCal-${mealKey}`);
            
            if (!nameInput.value || !calInput.value) return;

            addFood(mealKey, nameInput.value, Number(calInput.value));
        }

        function addFood(mealKey, foodName, calories) {
            state.mealsData[mealKey].consumed += calories;
            state.mealsData[mealKey].items.push({ name: foodName, cal: calories });
            state.mealsData[mealKey].isAdding = false;
            renderStep2();
        }

        function removeFood(mealKey, index, calories) {
            state.mealsData[mealKey].consumed -= calories;
            state.mealsData[mealKey].items.splice(index, 1);
            renderStep2();
        }

        // เริ่มการทำงานของแอปพลิเคชัน
        renderStep1();

    </script>
</body>
</html>
